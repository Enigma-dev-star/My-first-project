<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#78350F" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="#FFFBEB"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#goldGrad)" />
  <rect x="36" y="36" width="440" height="440" rx="92" fill="#1C1917" opacity="0.12" />

  <!-- Sweet Plate / Tray -->
  <ellipse cx="256" cy="330" rx="170" ry="46" fill="#FDE68A" filter="url(#shadow)" opacity="0.9" />
  <ellipse cx="256" cy="326" rx="150" ry="36" fill="#FEF3C7" />

  <!-- Sweets: Kalajam, Rosogolla, Sandesh arranged -->
  <!-- Left Sweet (Kalajam / Gulabjamun) -->
  <circle cx="190" cy="285" r="46" fill="#451A03" filter="url(#shadow)" />
  <ellipse cx="178" cy="270" rx="14" ry="8" fill="#78350F" opacity="0.6" />
  <circle cx="176" cy="265" r="4" fill="#FDE68A" opacity="0.8" /> <!-- Pistachio garnish -->

  <!-- Right Sweet (Rosogolla / Chamcham) -->
  <circle cx="322" cy="285" r="46" fill="#FEF3C7" filter="url(#shadow)" />
  <circle cx="322" cy="285" r="44" fill="#FDE68A" />
  <ellipse cx="310" cy="270" rx="14" ry="8" fill="#FFFBEB" opacity="0.7" />
  <path d="M318 260 L324 262 L320 268 Z" fill="#DC2626" opacity="0.8" /> <!-- Saffron strand -->

  <!-- Center Master Sweet (Peda / Sandesh) -->
  <circle cx="256" cy="245" r="54" fill="url(#goldGrad)" filter="url(#shadow)" />
  <circle cx="256" cy="245" r="48" fill="#F59E0B" />
  <ellipse cx="256" cy="235" rx="36" ry="24" fill="#FBBF24" />
  <!-- Crescent / Star Motif on Center Sweet -->
  <path d="M264 218 A16 16 0 1 1 248 248 A20 20 0 1 0 264 218 Z" fill="#FFFBEB" />
  <circle cx="270" cy="232" r="3" fill="#10B981" />

  <!-- Brand Typography -->
  <text x="256" y="420" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">MSMS</text>
  <text x="256" y="450" font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="16" fill="#FEF3C7" text-anchor="middle" letter-spacing="2">MUSLIM SWEETS</text>
</svg>

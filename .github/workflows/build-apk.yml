name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build MSMS Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install Node Dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build Web App (Vite)
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/MSMS.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MSMS-debug-apk
          path: build-output/MSMS.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MSMS Android APK (Offline Sweet Shop System)
          body: |
            ## Muslim Sweets Management System (MSMS) - Android APK
            
            - **Package**: `com.muslimsweets.msms`
            - **Minimum Android**: Android 10+ (API 29+)
            - **Target Android**: Android 15 (API 35)
            - **Offline Status**: 100% Offline (No Internet Permission Required)
            - **Update-Safe**: Signed with consistent debug keystore
            
            ### Installation:
            1. Download `MSMS.apk` to your phone or tablet.
            2. Tap to install (allow "Install unknown apps" if prompted).
            3. Open **MSMS** and use without any WiFi or cellular data!
          files: build-output/MSMS.apk
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
